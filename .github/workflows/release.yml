name: Release

on:
  push:
    branches: [main]

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race, and the later
# run fails pushing its version bump onto a ref that has already moved.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Without this, release publishes whatever is on main, linted or not.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No changelog-file: the release body is the changelog, and `font update`
      # reads `git log` between the two tags it moved across rather than a
      # tracked file.
      - uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
